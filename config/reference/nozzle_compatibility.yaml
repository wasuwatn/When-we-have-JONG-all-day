# UNVERIFIED reference data — transcribed by AI from a user-provided
# screenshot of a Fuji NXT "Nozzle compatibility table" on 2026-06-29.
#
# `verified: false` means nobody has checked these cells against the
# official Fuji Nozzle Compatibility Guide yet. While false, every
# nozzle/vision selection derived from this file is forced into
# needs_review by validate.py (see reference_rules.py / validate.py),
# no matter how confident the extraction was. Flip to true only after a
# human has line-by-line checked this file against the real guide (or
# regenerated it from a clean export/CSV of the table).
#
# Symbol meanings (matches the guide's legend):
#   supported       -> nozzle can be used as-is
#   multi:<n>        -> supported, but needs <n> nozzles for one operation
#   image_individual -> all nozzles used but images are taken individually
#   size_ok_no_nozzle -> part size is fine per spec, but no nozzle covers it
#   unsupported      -> cannot be supported based on specs
#
# Any cell not legible in the source screenshot is recorded as
# "unsupported" deliberately (fail-safe: never claim support we can't
# read clearly).

verified: false
source_note: >
  Transcribed from a screenshot pasted into chat; not yet cross-checked
  against the printed/PDF Fuji guide. Re-verify every row before trusting.

